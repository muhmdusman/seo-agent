services:
  postgres:
    image: postgres:17
    container_name: seo-agent-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_local_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: seo-agent-redis-local
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_local_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: seo-agent-adminer-local
    restart: unless-stopped

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_local_data:
  redis_local_data: